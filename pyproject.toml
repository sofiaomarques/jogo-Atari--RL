[project]
name = "atari-rl-game"
version = "0.1.0"
description = "Atari-style Gymnasium environment for reinforcement learning experiments."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
play = ["pygame>=2.5"]
train = ["gymnasium>=0.29", "stable-baselines3>=2.3", "pygame>=2.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
